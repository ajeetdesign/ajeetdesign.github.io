<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case study — Ajeet</title>
<meta name="description" content="Case study — product design work by Ajeet.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap">
<style>
  :root {
    --font: 'Plus Jakarta Sans', -apple-system, sans-serif;
    --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
    --ink-dark: #1c2b3a;
    --ink-soft: rgba(28, 43, 58, 0.72);
    --ink-faint: rgba(28, 43, 58, 0.5);
    --accent: #2f7fd4;
    --rule: rgba(28, 43, 58, 0.12);
    --page: #faf9f6;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; font-family: var(--font); background: var(--page); color: var(--ink-dark);
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  .wrap { width: min(92vw, 1080px); margin: 0 auto; }
  .narrow { width: min(92vw, 760px); margin: 0 auto; }

  /* ── the cross: the only chrome on the page ───────────────────────────── */
  .cs-close {
    position: fixed; top: 18px; right: 18px; z-index: 20;
    width: 42px; height: 42px; border: 1px solid var(--rule); border-radius: 999px;
    background: rgba(255, 255, 255, 0.82); cursor: pointer;
    display: grid; place-items: center; color: var(--ink-dark);
    backdrop-filter: blur(12px) saturate(1.4);
    -webkit-backdrop-filter: blur(12px) saturate(1.4);
    transition: transform .35s cubic-bezier(.2,.9,.25,1), background .25s ease;
    text-decoration: none;
  }
  .cs-close:hover { background: var(--ink-dark); color: #fff; transform: rotate(90deg); }
  .cs-close svg { width: 17px; height: 17px; }

  /* ── hero: eyebrow → title → intro | meta rail → feature banner ────────── */
  .cs-hero { padding: clamp(52px, 7vh, 84px) 0 clamp(36px, 5.5vh, 56px); }
  .cs-eyebrow {
    display: flex; align-items: center; gap: 9px; margin: 0 0 18px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--accent);
  }
  .cs-eyebrow .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--accent); flex: none; }
  .cs-hero h1 {
    font-family: var(--font-serif); font-weight: 400; letter-spacing: -0.015em;
    font-size: clamp(34px, 4.6vw, 58px); line-height: 1.06;
    margin: 0 0 clamp(20px, 2.6vw, 30px); max-width: 17ch;
  }
  .cs-hero .sub { font-size: clamp(14px, 1.5vw, 17px); line-height: 1.7; color: var(--ink-soft); margin: 0; max-width: 58ch; }
  .hero-banner {
    margin: clamp(36px, 5.5vw, 64px) 0 0;
    overflow: hidden; border-radius: 24px;
  }
  .hero-banner .shot {
    border: 0; border-radius: 0;
    aspect-ratio: 3240 / 1860; height: auto;
    will-change: transform;
  }

  /* hero grid: intro left, meta rail right */
  .hero-grid {
    display: grid; grid-template-columns: minmax(0, 1fr) clamp(200px, 22vw, 250px);
    gap: clamp(36px, 6vw, 110px); align-items: start;
  }
  .cs-meta { margin: 0; }
  .cs-meta > div { padding: 11px 0; border-top: 1px solid var(--rule); }
  .cs-meta dt { font-size: 10px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 5px; }
  .cs-meta dd { margin: 0; font-size: 13px; font-weight: 600; line-height: 1.5; }

  /* ── image placeholders — swap each .shot for <img class="shot" src="…"> ─ */
  .shot {
    width: 100%; border-radius: 20px; border: 1px solid rgba(255,255,255,0.5);
    display: grid; place-items: center; overflow: hidden; object-fit: cover;
    aspect-ratio: 16 / 9;
  }
  div.shot::after {
    content: attr(data-n); font-size: 11px; font-weight: 700; letter-spacing: 0.2em;
    text-transform: uppercase; color: rgba(255,255,255,0.9); text-align: center; padding: 0 20px;
  }
  .shot.tall { aspect-ratio: 4 / 3; }
  .shot.bleed { border-radius: 24px; }
  /* Opt-in via `wide: true` on a FIGURES entry, for artwork whose subject is a
     row of phone screens: inside a problem block a figure renders in the grid's
     right column (~806px of a 1080px wrap), where three phones land ~169px each
     and their UI is unreadable. The frame's height is fixed by the artwork's own
     aspect, so WIDTH is the only lever that scales them.

     Grows RIGHTWARD only. The left is occupied by .prob-rail, which is sticky —
     it sits beside the figure the whole time it is on screen — so expanding that
     way would slide the artwork underneath it.

     Sized by width rather than centred with a margin/transform: any 50% there
     resolves against the problem COLUMN, not the wrap, which pushes the figure
     right and off the viewport. The column's right edge coincides with the
     wrap's right edge, so the room available is half the difference between
     viewport and wrap, less a gutter. max() floors it at 0 so narrow viewports
     opt out instead of overflowing. */
  .shot--wide {
    /* Two guards, both deliberate:
       · the 48px gutter (was 20px) absorbs a classic scrollbar — `vw` counts
         the scrollbar, the layout width does not, so vw-based breakout math
         overshoots by half the scrollbar on any browser that reserves space
         for one. Headless hides scrollbars, so that error is invisible in
         capture and only shows up on a real machine.
       · the 160px cap stops the breakout growing without limit on a wide
         display, where 50vw - 540px runs to 700px+ and the figure would tower
         over the column of text it belongs to. */
    width: calc(100% + min(160px, max(0px, 50vw - min(46vw, 540px) - 48px)));
    max-width: none;
  }
  .g1 { background: linear-gradient(135deg, #ffd8a6, #ff9d6c 55%, #f76b8a); }
  .g2 { background: linear-gradient(135deg, #a6d8ff, #6c9dff 55%, #7b6bf7); }
  .g3 { background: linear-gradient(135deg, #c3f0c8, #6cc9a4 55%, #3f9d8a); }
  .g4 { background: linear-gradient(135deg, #e8d5ff, #b98cf5 55%, #8a6bf7); }
  .g5 { background: linear-gradient(135deg, #cfe0f2, #8fa9c6 55%, #5b7796); }

  /* ── section nav: sits in-flow after the hero, so it's off-screen at the
       top of the page; sticky only locks it to the viewport top once
       scrolling carries it there, right as Context arrives. Underline
       marks the section currently in view. ─────────────────────────────── */
  .secnav {
    position: sticky; z-index: 15; top: 0;
    background: rgba(250, 249, 246, 0.92);
    backdrop-filter: blur(14px) saturate(1.3);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
    padding-top: 22px;
  }
  .secnav .wrap { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: clamp(16px, 3vw, 40px); }
  .secnav a {
    display: block; min-width: 0; text-decoration: none; color: var(--ink-dark);
    padding-bottom: 14px; border-bottom: 1px solid var(--rule);
    transition: border-color .35s ease;
  }
  .secnav a b { display: block; font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
  .secnav a span {
    display: block; margin-top: 3px; font-size: 13px; color: var(--ink-soft);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .secnav a:hover { border-bottom-color: var(--ink-faint); }
  .secnav a.on { border-bottom: 2px solid var(--accent); padding-bottom: 13px; }
  /* below this the .wrap is wide enough to run under the fixed cross */
  @media (max-width: 1240px) { .secnav .wrap { padding-right: 54px; } }
  #cs section { scroll-margin-top: 70px; }

  /* ── sections ──────────────────────────────────────────────────────────── */
  section { padding: clamp(60px, 9vh, 104px) 0; }
  /* every section opens on a number + label, then a full-width rule before
     the heading — the rule is what gives each beat a hard start */
  .kicker {
    display: flex; align-items: baseline; gap: 10px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink-faint); margin: 0 0 18px;
  }
  .kicker .kn { color: var(--accent); }
  .kicker-rule { border: 0; border-top: 1px solid var(--rule); margin: 0 0 32px; }
  h2 {
    font-family: var(--font-serif); font-weight: 400; letter-spacing: -0.01em;
    font-size: clamp(28px, 3.4vw, 40px);
    line-height: 1.12; margin: 0 0 18px; max-width: 22ch;
  }
  h3 { font-size: clamp(18px, 1.9vw, 22px); font-weight: 700; letter-spacing: -0.025em; margin: 0 0 10px; }
  p { font-size: clamp(14px, 1.45vw, 16px); line-height: 1.7; color: var(--ink-soft); margin: 0 0 16px; }
  p:last-child { margin-bottom: 0; }
  p strong { font-weight: 600; color: var(--ink-dark); }
  .step { margin-top: clamp(36px, 5vw, 56px); }
  .figure { margin: clamp(18px, 2.4vw, 28px) 0 0; }

  /* horizontal challenge — copy left, image right */
  .ch-split {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
    gap: clamp(28px, 4.5vw, 60px); align-items: stretch;
  }
  .ch-split .figure { margin-top: 0; display: flex; flex-direction: column; }
  .ch-split .shot { flex: 1; aspect-ratio: auto; min-height: 320px; }
  .wide-copy { max-width: 760px; }
  /* blocksHtml gives every `p` block its own .wide-copy wrapper, so each <p> is
     an only child and therefore matches `p:last-child { margin-bottom: 0 }`
     above — which is meant for trailing space inside multi-paragraph cards, but
     here silently stripped the gap from EVERY paragraph, running consecutive
     ones together. Restore it on the wrapper, and only between two adjacent
     copy blocks, so spacing around shots, lists and headings is untouched. */
  .wide-copy + .wide-copy { margin-top: 16px; }
  .wide-copy--rest { margin-top: clamp(18px, 2.4vw, 28px); }
  /* the opening beat of a wide section: heading left, its first paragraph
     right, rather than stacked — the image still runs full-width below */
  .wide-copy--head {
    display: grid; grid-template-columns: 1fr 1.05fr;
    gap: clamp(24px, 4vw, 56px); align-items: start; max-width: none;
  }
  .wide-copy--head h2, .wide-copy--head p { margin: 0; max-width: none; }
  @media (max-width: 860px) { .wide-copy--head { grid-template-columns: 1fr; } }
  /* a paragraph that is bold start-to-finish is a closing statement, not a
     sentence — it gets its own centred serif line instead of running with
     the rest of the copy */
  .pull-quote {
    font-family: var(--font-serif); font-weight: 400; font-style: normal;
    font-size: clamp(22px, 2.7vw, 32px); line-height: 1.32; letter-spacing: -0.01em;
    color: var(--ink-dark); text-align: center; max-width: 32ch;
    margin: clamp(30px, 4.5vw, 52px) auto;
  }
  .figure figcaption { font-size: 13px; color: var(--ink-faint); margin-top: 12px; text-align: center; }
  /* figures do not react to hover — they are artwork, not controls */

  /* how-might-we cards */
  .hmw { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(12px, 1.6vw, 18px); margin-top: clamp(22px, 2.8vw, 32px); }
  .hmw-card {
    background: #fff; border: 1px solid var(--rule); border-radius: 18px;
    padding: clamp(18px, 2.2vw, 24px);
    transition: transform .4s cubic-bezier(.2,.9,.25,1), box-shadow .4s ease;
  }
  .hmw-card:hover { transform: translateY(-4px); box-shadow: 0 24px 50px -30px rgba(15, 30, 50, 0.5); }
  .hmw-card .n { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; color: var(--accent); }
  .hmw-card h3 { font-size: clamp(15px, 1.6vw, 17px); line-height: 1.4; margin: 10px 0 8px; }
  .hmw-card p { font-size: 13px; line-height: 1.6; margin: 0; }
  .ap-outro { max-width: 720px; margin-top: clamp(22px, 2.8vw, 32px); }
  .ap-outro p { font-size: 14px; font-weight: 400; line-height: 1.7; }

  /* problem walkthroughs inside the approach — a sticky left rail carries the
     number, the heading and the result; the narrative scrolls past it on the
     right, so the stat that closes a problem is visible the whole time you're
     reading toward it, not just at the very bottom */
  .prob {
    margin-top: clamp(64px, 8vw, 100px);
    display: grid; grid-template-columns: minmax(160px, 210px) minmax(0, 1fr);
    gap: clamp(28px, 4vw, 64px); align-items: start;
  }
  /* space, not a rule, between one problem and the next. The extra top padding
     lands on every problem but the first, which already opens the approach
     section cleanly on its own. */
  .prob--sep { padding-top: clamp(56px, 7vw, 88px); }
  .prob-rail { position: sticky; top: 100px; }
  .prob-k {
    font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 10px;
  }
  .prob-h {
    font-family: var(--font-serif); font-weight: 400; letter-spacing: -0.01em;
    font-size: clamp(24px, 2.6vw, 30px); line-height: 1.12;
    margin: 0 0 20px; padding-bottom: 20px; border-bottom: 1px solid var(--rule);
  }
  .prob-result-k {
    font-size: 10px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-faint); margin: 0 0 8px;
  }
  .prob-stat {
    font-family: var(--font-serif); font-weight: 400; letter-spacing: -0.01em;
    font-size: clamp(32px, 3.2vw, 42px); line-height: 1; color: var(--accent);
    margin: 0 0 8px;
  }
  .prob-result-p { font-size: 13px; line-height: 1.6; color: var(--ink-soft); margin: 0; }
  /* two or more figures stacked in the rail. The rail is only 160–210px wide,
     so the single-stat size would let two of these dominate the problem they
     belong to — they step down, and the gap does the separating rather than a
     rule, matching the rest of this page. */
  .prob-result-multi > * + * { margin-top: 18px; }
  .prob-result-multi .prob-stat { font-size: clamp(26px, 2.7vw, 34px); margin: 0 0 4px; }
  .prob-result-list { list-style: none; margin: 0; padding: 0; }
  .prob-result-list li {
    font-size: 14px; font-weight: 700; color: var(--ink-dark); margin: 0 0 6px;
  }
  @media (max-width: 860px) {
    .prob { grid-template-columns: 1fr; }
    .prob-rail { position: static; }
  }

  /* ── solution blocks: copy, image rows, insight + result callouts ───────── */
  .wide-copy p { max-width: 720px; }
  /* three columns of copy, one per image in the row above — sits at the full
     .wrap width so each column lines up under what it describes */
  .col3 {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: clamp(18px, 2.6vw, 36px);
    margin: clamp(18px, 2.2vw, 26px) 0 clamp(22px, 2.8vw, 32px);
  }
  .col3 p { max-width: none; margin: 0; }
  .col3 strong { color: var(--ink-dark); font-weight: 700; }
  /* takeaways, two across. Unboxed on purpose: these are prose, and the card
     chrome .hmw-card carries would make four short paragraphs read as a feature
     comparison. The column gap is wider than the row gap so the pairs separate
     left-to-right before they separate top-to-bottom. */
  .grid2 {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: clamp(22px, 3vw, 38px) clamp(28px, 4vw, 60px);
    margin: clamp(18px, 2.2vw, 26px) 0 clamp(22px, 2.8vw, 32px);
  }
  .grid2 h4 {
    font-size: clamp(15px, 1.6vw, 17px); font-weight: 700; letter-spacing: -0.015em;
    line-height: 1.35; color: var(--ink-dark); margin: 0 0 8px;
  }
  .grid2 p { max-width: none; margin: 0; font-size: clamp(13px, 1.4vw, 15px); line-height: 1.65; }
  .grid2 strong { color: var(--ink-dark); font-weight: 700; }
  @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }
  /* image + the copy describing it, kept as one unit so they travel together
     when the row collapses to a single column */
  .pairs {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: clamp(18px, 2.6vw, 36px);
    margin: clamp(18px, 2.2vw, 26px) 0 clamp(22px, 2.8vw, 32px);
  }
  .pairs .figure { margin: 0 0 clamp(12px, 1.4vw, 16px); }
  /* The iteration frames are cut-out mockups on transparency, so they carry no
     plate of their own — the panel chrome every other .shot gets would draw a
     bordered box around empty space, and the shared hover would lift and shadow
     a rectangle that isn't there. A portrait box lets the single-phone shots
     fill their column instead of being held back by the two-phone one. */
  .pairs .shot {
    aspect-ratio: 4 / 5; object-fit: contain;
    border: 0; border-radius: 0; background: none;
  }
  /* A two-screen frame is as wide as it is tall, so in an equal column it hits
     the width first and renders short while its siblings fill the height. Give
     it 1.6x the column and the matching box ratio, and every frame lands at the
     same height — which is what makes the phones read as one size. The three
     ratios are coupled: 1.6 x 5/8 = 1/1, so the taller 5/8 box is restored here
     rather than inherited. */
  .pairs--wide-last { grid-template-columns: 1fr 1fr 1.6fr; }
  .pairs--wide-last .shot { aspect-ratio: 5 / 8; }
  .pairs--wide-last .pair:last-child .shot { aspect-ratio: 1 / 1; }
  /* roomy: 2 columns, each ~50% wider than the default 3-across split, with
     the odd third item centred on its own row at the same width as the
     other two rather than stretched to fill it. */
  .pairs--roomy { grid-template-columns: repeat(2, 1fr); text-align: center; }
  .pairs--roomy .pair:nth-child(3) { grid-column: 1 / -1; }
  .pairs--roomy .pair:nth-child(3) .figure {
    width: calc(50% - clamp(9px, 1.3vw, 18px)); margin-left: auto; margin-right: auto;
  }
  .pairs p { max-width: none; margin: 0; }
  .pairs strong { color: var(--ink-dark); font-weight: 700; }
  /* tertiary heading: inside a problem the h3 slots are already taken by the
     problem title and .sub-h, so this is an h4 and must read below both */
  .sub-h4 {
    font-size: clamp(18px, 2vw, 21px); font-weight: 800; letter-spacing: -0.015em;
    color: var(--ink-dark); margin: clamp(26px, 3.2vw, 38px) 0 10px;
  }
  .shot-row { display: grid; gap: clamp(12px, 1.6vw, 18px); margin: clamp(22px, 2.8vw, 32px) 0; }
  /* back-to-back asset rows (no text between them) don't need the full
     text-to-image breathing room twice over — the row's own top margin plus
     .figure's margin-top were stacking into a much bigger gap between two
     consecutive shots than between any other pair of blocks. Both sides of
     the pair need the smaller value: adjacent margins collapse to whichever
     is LARGER, so shrinking only one side (with the other still at 32px)
     changes nothing. */
  .shot-row:has(+ .shot-row) { margin-bottom: 10px; }
  .shot-row + .shot-row { margin-top: 10px; }
  .shot-row + .shot-row .figure { margin-top: 0; }
  /* opt-in (b.tight in cases.src.mjs): pulls a shot-row in close under the
     paragraph introducing it, for the cases where the asset reads as part
     of that paragraph's own thought rather than a new visual beat. */
  .shot-row.tight { margin-top: 10px; }
  .shot-row.tight .figure { margin-top: 0; }
  .shot-row.n2 { grid-template-columns: repeat(2, 1fr); }
  .shot-row.n3 { grid-template-columns: repeat(3, 1fr); }
  .shot-row.n1 .shot { aspect-ratio: 2 / 1; }
  .shot-row.n2 .shot { aspect-ratio: 3 / 2; }
  /* bento: one large tile + two stacked, taller overall block */
  .shot-bento {
    display: grid; gap: clamp(12px, 1.6vw, 18px);
    grid-template-columns: 1.5fr 1fr; grid-template-rows: repeat(2, 1fr);
    aspect-ratio: 16 / 10; margin: clamp(22px, 2.8vw, 32px) 0;
  }
  .shot-bento .figure { margin: 0; min-height: 0; }
  .shot-bento .figure:first-child { grid-row: 1 / span 2; }
  .shot-bento .shot { width: 100%; height: 100%; aspect-ratio: auto; min-height: 0; }

  /* ── prototype demo: the clip on a soft ground, then the steps ──────────────
     The clip is a phone capture (1:2), so it can never fill a 1080px column on
     its own. Sizing it by HEIGHT instead of width keeps the phone a believable
     size at every viewport, and the panel behind it does the job of filling the
     measure — the same move the gradient .shot placeholders make. */
  .proto {
    display: grid; place-items: center; overflow: hidden;
    border-radius: 24px; padding: clamp(22px, 3.2vw, 44px) 0;
    background: linear-gradient(160deg, #eaf1fa, #dce7f5 58%, #cedcee);
    /* tight underneath: the note that follows (asset 01) describes THIS clip,
       so it has to read as attached to it. The air goes below that note
       instead — see .proto-note — which is where the step sequence begins. */
    margin: clamp(22px, 2.8vw, 32px) 0 clamp(14px, 1.8vw, 20px);
  }
  .proto video {
    display: block; width: auto; height: clamp(340px, 46vw, 540px);
    aspect-ratio: 1 / 2; border-radius: clamp(16px, 1.9vw, 26px);
    background: #fff;
    box-shadow: 0 2px 8px rgba(15, 30, 50, 0.10), 0 30px 60px -32px rgba(15, 30, 50, 0.5);
  }
  /* reduced motion gets the controls back, because a paused video with no way
     to start it is just a screenshot that lies about being one */
  .proto video[controls] { height: auto; width: clamp(220px, 26vw, 320px); }

  /* ── splash clips: one panel per asset type ────────────────────────────────
     The screen is deliberately cut off by its panel rather than floating inside
     one. The clip is 1:2, so a well of 1:1.5 shows the top three quarters and
     the panel's bottom edge takes the rest — which is also where the artwork
     runs out of content, so nothing of consequence is lost. The crop is done
     by the container, not baked into the file, so the framing stays adjustable. */
  .splash-row {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: clamp(14px, 2vw, 26px);
    margin: clamp(22px, 2.8vw, 32px) 0;
  }
  .splash { margin: 0; }
  .splash-panel {
    display: grid; justify-items: center; overflow: hidden;
    border-radius: clamp(18px, 2.2vw, 24px);
    padding: clamp(18px, 3vw, 38px) clamp(16px, 2.6vw, 34px) 0;
    background: linear-gradient(160deg, #eaf1fa, #dce7f5 58%, #cedcee);
  }
  .splash-media {
    width: min(100%, 300px); aspect-ratio: 1 / 1.5; overflow: hidden;
    border-radius: clamp(12px, 1.6vw, 18px) clamp(12px, 1.6vw, 18px) 0 0;
    box-shadow: 0 2px 8px rgba(15, 30, 50, 0.10), 0 24px 50px -30px rgba(15, 30, 50, 0.5);
  }
  /* height is left to the aspect ratio; the overflow past the well is the crop */
  .splash-media video { display: block; width: 100%; aspect-ratio: 1 / 2; }
  .splash figcaption {
    font-size: 13px; color: var(--ink-faint); margin-top: 12px; text-align: center;
  }
  /* paused for reduced motion, the controls sit in the cropped-off quarter —
     let the well show the whole clip so they stay reachable */
  .splash-media:has(video[controls]) { aspect-ratio: auto; }

  /* the four mockups in one line, each step named underneath its own pair.
     The shots are cut out to transparency, so there is no plate behind them —
     they sit on the page like the iteration frames do. Equal HEIGHT is what
     makes them read as one set; the widths differ because the devices do. */
  .vgrid {
    display: grid; grid-template-columns: repeat(4, 1fr); align-items: end;
    /* the row gap is wide because it is the only thing separating the screens
       from their step labels now — there is no rule between them */
    gap: clamp(26px, 3.4vw, 44px) clamp(10px, 1.4vw, 20px);
    margin-bottom: clamp(22px, 2.8vw, 32px);
    --screen: 391 / 860;
  }
  /* Every shot is cropped to its screen and normalised to one aspect, because
     the source mockups were drawn at four different proportions and no amount
     of scaling makes those read as one set. The device frame is drawn here
     instead — one ring for all four, so they are identical by construction.
     A spread shadow costs no layout width, so the sizes stay equal.
     The ratio is a variable because it is a property of the export, not of the
     component: one demo's screens come out of Figma at 391x860 and another's at
     720x1440, and forcing the second into the first's box stretches the type by
     a tenth. A demo that ships a different aspect declares it on the grid. */
  .vgrid img {
    display: block; justify-self: center; width: auto;
    height: clamp(240px, 27vw, 400px); aspect-ratio: var(--screen);
    border-radius: clamp(10px, 1.1vw, 15px);
    box-shadow: 0 0 0 5px #1b1f26, 0 0 0 6px #454b55,
                0 16px 30px -20px rgba(15, 30, 50, 0.45);
  }
  /* Artwork that arrives already wearing its device frame. Two things have to
     come off, or the exports are not what ships:
       · the drawn ring above would be a second frame around the supplied one
       · `aspect-ratio` would FILL (this img sets no object-fit), stretching each
         export by however far it sits from the declared ratio. Dropping it lets
         every screen keep its own proportions exactly as exported — equal HEIGHT
         is what makes them read as one set, which is how .pairs works too.
     The lift becomes a drop-shadow because that follows the alpha: these are
     cut-out phones with rounded corners, and a box-shadow would trace the
     rectangular box instead of the device. */
  .vgrid--framed img {
    aspect-ratio: auto; border-radius: 0; box-shadow: none;
    filter: drop-shadow(0 14px 16px rgba(15, 30, 50, 0.22));
  }
  /* unscoped (not ".vgrid .lbl") so a numbered {label,text} note can reuse
     the exact same look outside the grid, as "asset 01" ahead of the steps.
     No rule or top padding — space alone separates a label from what's above it */
  .lbl { grid-column: span 2; margin: 0; }
  /* the grid's align-items: end (which sits the four screens on a common
     baseline) would otherwise drop the shorter step's block to the bottom of
     the row — hang both step labels from the top instead so their numbers and
     first lines line up regardless of how many lines of copy each carries */
  .vgrid .lbl { align-self: start; }
  .lbl .t {
    display: flex; align-items: baseline; gap: 9px; margin: 0 0 6px;
    font-size: clamp(13px, 1.45vw, 15px); font-weight: 700;
    letter-spacing: -0.01em; color: var(--ink-dark);
  }
  .lbl .n { font-size: 10px; letter-spacing: 0.18em; color: var(--accent); flex: none; }
  .lbl .d { margin: 0; font-size: clamp(13px, 1.35vw, 14px); line-height: 1.6; max-width: 48ch; }
  /* the lead-in between the clip and the four screens. It belongs to the clip
     above it (tight margin on .proto), so the break between the two halves of
     the demo lands here, under it, rather than above. */
  .proto-note { max-width: 760px; margin: 0 0 clamp(48px, 6vw, 76px); }
  /* four across gets too small on a phone — two per row, each step's label
     still directly under its own pair rather than both sinking to the end */
  @media (max-width: 700px) {
    .vgrid { grid-template-columns: repeat(2, 1fr); }
    .vgrid > :nth-child(1) { grid-area: 1 / 1; }
    .vgrid > :nth-child(2) { grid-area: 1 / 2; }
    .vgrid > :nth-child(5) { grid-area: 2 / 1 / auto / span 2; }
    .vgrid > :nth-child(3) { grid-area: 3 / 1; }
    .vgrid > :nth-child(4) { grid-area: 3 / 2; }
    .vgrid > :nth-child(6) { grid-area: 4 / 1 / auto / span 2; }

<!-- Which studies are still hosted elsewhere; read by the redirect just below.
     Keep v= in step with the copy of this tag in index.html — a stale table
     here would redirect a reader who has already been sent the other way. -->
<script src="js/case-links.js?v=1"></script>
<script>
/* embedded in index.html's full-screen layer? then close = tell the parent */
var EMBED = new URLSearchParams(location.search).get('embed') === '1';

/* A study still hosted elsewhere has one destination however a reader arrives:
   index.html points its card straight out, and this catches anyone who reaches
   the internal URL directly. Declared once in js/case-links.js — deleting a
   line there brings that study back in-house and this stops firing for it.

   Deliberately ahead of the password gate: being sent off the site should not
   require unlocking content the reader is never going to see. And when embedded
   the whole tab moves rather than the iframe, which would otherwise load
   another site inside our own overlay. */
(function () {
  var links = window.CASE_LINKS || {};
  var want = (new URLSearchParams(location.search).get('id') || '').replace(/[^a-z-]/g, '');
  /* hasOwnProperty, not a bare lookup: ?id=constructor would otherwise resolve
     to something inherited and truthy */
  if (Object.prototype.hasOwnProperty.call(links, want) && links[want]) {
    (EMBED ? parent : window).location.replace(links[want]);
  }
})();

/* ─────────────────────────────────────────────────────────────────────────────
   One template, four case studies. Structure follows the reference:
   hero → meta → challenge → approach (sub-beats) → breakthrough → results
   (pull quote, flow, outcome cards) → next project.

   CONTENT IS NOT IN THIS FILE. It ships encrypted in cases.enc.json and the
   password is the decryption key (PBKDF2 → AES-GCM via Web Crypto). Edit copy
   in cases.src.mjs, then rebuild:  node encrypt-cases.mjs <password>
   ───────────────────────────────────────────────────────────────────────────── */
function b64d(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }

function decryptCases(meta, key) {
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(meta.iv) }, key, b64d(meta.data))
    .then(function (plain) { return JSON.parse(new TextDecoder().decode(plain)); });
}
function keyFromPassword(meta, pw) {
  return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
    .then(function (base) {
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', hash: 'SHA-256', salt: b64d(meta.salt), iterations: meta.iter },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    });
}

var gate = document.getElementById('gate');
var gateForm = document.getElementById('gate-form');

fetch('cases.enc.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (meta) {
  /* Always ask for the password — the key is never persisted. So every card
     open and every reload re-locks, and unlocking one project never carries
     over to the others (each opens a fresh, still-locked case.html). */
  gate.hidden = false;
  var input = gateForm.querySelector('input');
  input.value = '';
  input.focus();
  gateForm.addEventListener('submit', function (e) {
    e.preventDefault();
    gateForm.classList.remove('no');
    keyFromPassword(meta, input.value)
      .then(function (key) {
        /* AES-GCM authenticates — a wrong password fails here, nothing to compare */
        return decryptCases(meta, key).then(function (cases) {
          gate.hidden = true;
          render(cases);
        });
      })
      .catch(function () {
        input.select();
        void gateForm.offsetWidth; /* restart the shake animation */
        gateForm.classList.add('no');
      });
  });
});

function render(CASES) {

var id = new URLSearchParams(location.search).get('id');
if (!CASES[id]) id = 'porter';
var c = CASES[id];

/* real cover images keyed by case id — plaintext (only the copy is encrypted) */
var COVERS = { porter: 'images/porter-cover.jpg' };

/* real body images keyed by case id → placeholder label */
var FIGURES = { porter: {
  'Porter-branded trucks and two-wheelers on the road': 'images/porter-context.jpg',
  /* 54/31 (1.742), not the 16:9 this used to be: the light redesign of the
     diagram came out at 6480x3720. Every .shot is object-fit: cover, so without
     the ratio the frame would silently crop ~2% off the top and bottom — which
     is exactly where the "Existing Process" title and the red failure labels sit. */
  'The manual ops behind the program': {
    src: 'images/porter-manual-ops.png?v=4',
    srcset: 'images/porter-manual-ops-1080.png?v=4 1080w, images/porter-manual-ops.png?v=4 2160w',
    ratio: '54 / 31'
  },
  'Partner motivations & research insights': {
    src: 'images/porter-personas.png?v=2',
    srcset: 'images/porter-personas-1080.png?v=2 1080w, images/porter-personas.png?v=2 2160w'
  },
  'Iteration — narrative': 'images/porter-iteration-1.webp',
  'Iteration — visuals': 'images/porter-iteration-2.webp',
  'Onboarding concepts': 'images/porter-iteration-3.webp',
  'Verification — the ask': 'images/porter-verification-1.webp',
  'Verification — the selfie': 'images/porter-verification-2.webp',
  'Verification — the result': 'images/porter-verification-3.webp',
  'Partner questions & business impact': {
    src: 'images/porter-partner-questions.webp',
    ratio: '36 / 17'          /* the artwork is 4320x2040, not the row's 2:1 */
  },
  /* the three prioritisation cards — each already headed in the artwork */
  'Motivation — how am I doing and how much can I earn':  { src: 'images/porter-priority-1.webp?v=2', ratio: '1068 / 1367', caption: false },
  'Transparency — how are my rewards calculated':         { src: 'images/porter-priority-2.webp?v=2', ratio: '1068 / 1367', caption: false },
  'Help & guidance — what should I do next':              { src: 'images/porter-priority-3.webp?v=2', ratio: '1068 / 1367', caption: false },
  /* The fleet shot closing the results section. Cropped to a 5:2 band rather
     than left at the camera's 3:2 — full height it ran 720px tall in the
     column, which is more room than a closing photo needs. The crop sits low

  'Program impact overview': {

document.title = c.title + ' — Ajeet';

/* A FIGURES entry is either a plain src, or an object carrying any of:
     srcset — hands the browser an exact pixel match per display density. A
              fixed 2x asset has to be resampled on a 1x screen, and that
              resample is what reads as soft on flat artwork with fine type.
              `sizes` mirrors .wrap: min(92vw, 1080px).
     ratio  — the artwork's own aspect, so the frame fits it rather than the
              row's default. Every .shot is object-fit: cover, so a frame that
              disagrees with the artwork crops it silently. */
function shot(s, grad, extra) {
  var f = (FIGURES[id] || {})[s[0]];
  if (f) {
    var src = typeof f === 'string' ? f : f.src;
    /* wide — breaks this one figure out of the 1080px text column (see
       .shot--wide). The `sizes` hint has to follow it: left at 1080px the
       browser picks a candidate for the column and the wider frame then
       renders an upscale of it, which is the opposite of the point. */
    var wide = (typeof f === 'object' && f.wide);
    var srcset = (typeof f === 'object' && f.srcset)
      ? ' srcset="' + f.srcset + '" sizes="' +
        (wide ? '(max-width: 1500px) 94vw, 1400px' : '(max-width: 1173px) 92vw, 1080px') + '"' : '';
    var ratio = (typeof f === 'object' && f.ratio)
      ? ' style="aspect-ratio:' + f.ratio + '"' : '';
    return '<img class="shot ' + (s[1] || '') + ' ' + (extra || '') +
      (wide ? ' shot--wide' : '') + '" src="' + src + '"' +
      srcset + ratio + ' alt="' + s[0] + '">';
  }
  return '<div class="shot ' + grad + ' ' + (s[1] || '') + ' ' + (extra || '') + '" data-n="' + s[0] + '"></div>';
}

/* A figure whose artwork already carries its own heading does not need a
   caption repeating it — `caption: false` on the FIGURES entry drops it. */
function caption(label) {
  var f = (FIGURES[id] || {})[label];
  if (f && typeof f === 'object' && f.caption === false) return '';
  return '<figcaption>' + label + '</figcaption>';
}

/* The demo block: an autoplaying, chromeless screen recording, then the steps
   it decomposes into. muted is what makes autoplay legal in every browser;
   playsinline stops iOS from throwing it into the fullscreen player. */
function demo(d) {
  /* The clip is optional: a demo whose recording has not landed yet still has
     four screens worth showing, and an empty <video> would render as a broken
     black plate rather than as nothing. */
  var h = d.video ? '<div class="proto rv">' +
    '<video src="' + d.video.src + '" poster="' + d.video.poster + '"' +
    ' autoplay muted loop playsinline preload="metadata" disablepictureinpicture' +
    ' aria-label="' + d.video.alt + '"></video></div>' : '';
  /* every mockup first, then the labels — the grid puts each label back under
     its own pair, and this order is what the phone breakpoint reshuffles.
     A note can be a plain lead-in string, or — like a step — a numbered
     {label, text} pair; the latter takes 01 and pushes the steps after it
     to 02, 03…, so the whole demo reads as one numbered sequence. */
  var stepStart = 1;
  if (d.note) {
    if (typeof d.note === 'object') {
      h += '<div class="lbl proto-note rv"><p class="t"><span class="n">01</span>' +
        d.note.label + '</p>' + (d.note.text ? '<p class="d">' + d.note.text + '</p>' : '') + '</div>';
      stepStart = 2;
    } else {
      h += '<p class="proto-note rv">' + d.note + '</p>';
    }
  }
  var shots = '', labels = '';
  (d.steps || []).forEach(function (st, i) {
    shots += st.shots.map(function (s) {
      return '<img src="' + s.src + '" alt="' + s.alt + '" loading="lazy" decoding="async">';
    }).join('');
    labels += '<div class="lbl"><p class="t"><span class="n">0' + (i + stepStart) + '</span>' +
      st.label + '</p>' + (st.text ? '<p class="d">' + st.text + '</p>' : '') + '</div>';
  });
  var ratio = d.ratio ? ' style="--screen:' + d.ratio + '"' : '';
  /* framed: the artwork already carries its own device frame, so the grid must
     not draw a second one around it — see .vgrid--framed. */
  var cls = 'vgrid rv' + (d.framed ? ' vgrid--framed' : '');
  return h + '<div class="' + cls + '"' + ratio + '>' + shots + labels + '</div>';
}

/* sections number themselves — cases can skip any of them */
var secNum = 0;

var h = '';

/* A paragraph that is bold start-to-finish is a closing statement, not a
   sentence in the flow — render it as a centred pull-quote instead, so it
   doesn't need a duplicate copy in a separate field just to be styled apart. */
function renderP(p) {
  var m = /^\s*<strong>([\s\S]*)<\/strong>\s*$/.exec(p);
  return m ? '<p class="pull-quote rv">' + m[1] + '</p>' : '<p class="rv">' + p + '</p>';
}

/* challenge + problem share one renderer; split = copy left, image right */
function textSection(sec, fallbackK) {
  var open = '<section' + (sec.nav ? ' data-nav="' + sec.nav + '"' : '') + '>';
  var head = kickHtml(sec.k || fallbackK);
  if (sec.blocks) {
    return open + '<div class="wrap">' + head + '<h2 class="rv">' + sec.h + '</h2>' + blocksHtml(sec.blocks) + '</div></section>';
  }
  var body = '<h2 class="rv">' + sec.h + '</h2>' +
    sec.p.map(renderP).join('');
  var fig = sec.shot
    ? '<figure class="figure rv">' + shot(sec.shot, c.grad, 'bleed') +
      caption(sec.shot[0]) + '</figure>'
    : '';
  if (sec.split) {
    return open + '<div class="wrap">' + head +
      '<div class="ch-split"><div>' + body + '</div>' + fig + '</div></div></section>';
  }
  if (sec.wide) {
    var at = fig ? (FIG_AFTER[id] || {})[sec.nav] : null;
    if (at != null && sec.p) {
      /* interleave: copy through paragraph N, then the image, then the rest.
         The opening beat (heading + first paragraph) runs as a head-split —
         heading left, paragraph right — via wide-copy--head. */
      var ps = sec.p.map(renderP);
      return open + '<div class="wrap">' + head +
        '<div class="wide-copy wide-copy--head"><h2 class="rv">' + sec.h + '</h2>' + ps.slice(0, at + 1).join('') + '</div>' +
        fig +
        (ps.length > at + 1 ? '<div class="wide-copy wide-copy--rest">' + ps.slice(at + 1).join('') + '</div>' : '') +
        '</div></section>';
    }
    /* left-aligned copy, image running the full content width below */
    return open + '<div class="wrap">' + head +
      '<div class="wide-copy">' + body + '</div>' + fig + '</div></section>';
  }
  return open + '<div class="narrow">' + head + body + '</div>' +
    (fig ? '<div class="wrap">' + fig + '</div>' : '') + '</section>';
}

/* content blocks: paragraphs, image rows, insight + result callouts */
function blocksHtml(blocks) {
  var bh = '';
  for (var bi = 0; bi < blocks.length; bi++) {
    var b = blocks[bi], next = blocks[bi + 1];

    /* A shots row followed by a cols block of the same length is one idea per
       column: image, then the copy describing it. Render them as paired units
       rather than two sibling grids — aligning two grids only works while both
       are three columns wide, and on a phone they collapse to every image
       first, then every caption. */
    if (b.shots && b.shots.length > 1 && next && next.cols &&
        next.cols.length === b.shots.length &&
        !(MERGE_SHOTS[id] || {})[b.shots.map(function (s) { return s[0]; }).join('|')]) {
      var mkey2 = b.shots.map(function (s) { return s[0]; }).join('|');
      var wide = (PAIRS_WIDE_LAST[id] || {})[mkey2];
      var roomy = (PAIRS_ROOMY[id] || {})[mkey2];
      bh += '<div class="pairs' + (wide ? ' pairs--wide-last' : '') + (roomy ? ' pairs--roomy' : '') + '">' + b.shots.map(function (s, k) {
        return '<div class="pair rv"><figure class="figure">' + shot(s, c.grad, 'bleed') +
          '</figure><p>' + next.cols[k] + '</p></div>';
      }).join('') + '</div>';
      bi++;                       /* the cols block has been consumed */
      continue;
    }

    if (b.p) bh += '<div class="wide-copy">' + renderP(b.p) + '</div>';
    else if (b.quote) bh += '<blockquote class="bq rv">&ldquo;' + b.quote + '&rdquo;' +
      (b.cite ? '<cite>' + b.cite + '</cite>' : '') + '</blockquote>';
    else if (b.list) bh += '<ul class="blist rv">' + b.list.map(function (li) { return '<li>' + li + '</li>'; }).join('') + '</ul>';
    /* ordered twin of `list`, for items the copy has already counted ("two
       areas", "three steps") — there the numbers carry meaning the bullets
       would throw away. Same .blist styling; ::marker colours a number too. */
    else if (b.olist) bh += '<ol class="blist rv">' + b.olist.map(function (li) { return '<li>' + li + '</li>'; }).join('') + '</ol>';
    else if (b.insight) bh += '<aside class="insight rv">' + b.insight + '</aside>';
    else if (b.metrics) bh += '<div class="outcomes rv">' + b.metrics.map(function (m) {
      return '<div class="outcome"><p class="stat">' + m[0] + '</p><h3>' + m[1] + '</h3>' + (m[2] ? '<p>' + m[2] + '</p>' : '') + '</div>';

    else if (b.sub) bh += '<h3 class="sub-h rv">' + b.sub + '</h3>';
    else if (b.sub4) bh += '<h4 class="sub-h4 rv">' + b.sub4 + '</h4>';
    else if (b.cols) bh += '<div class="col3 rv">' + b.cols.map(function (col) {

    else if (b.grid2) bh += '<div class="grid2 rv">' + b.grid2.map(function (g) {
      return '<div><h4>' + g[0] + '</h4><p>' + g[1] + '</p></div>';
    }).join('') + '</div>';
    else if (b.clips) {
      bh += '<div class="splash-row">' + b.clips.map(function (cl) {
        var v = (CLIPS[id] || {})[cl[0]];

          ' autoplay muted loop playsinline preload="metadata" disablepictureinpicture' +
          ' aria-label="' + v.alt + '">' +
          '<source src="' + v.webm + '" type="video/webm">' +
          '<source src="' + v.mp4 + '" type="video/mp4">' +
          '</video></div></div>' +

          '</figure>';

    else if (b.shots && b.shots.length === 1 && (DEMOS[id] || {})[b.shots[0][0]]) {
      bh += demo((DEMOS[id] || {})[b.shots[0][0]]);
    }
    else if (b.shots) {
      var shots = b.shots;
      var mkey = shots.map(function (s) { return s[0]; }).join('|');
      var merged = (MERGE_SHOTS[id] || {})[mkey];
      if (merged) shots = [[merged, '']];
      bh += '<div class="shot-row n' + shots.length + (b.tight ? ' tight' : '') + '">' + shots.map(function (s) {
        return '<figure class="figure rv">' + shot(s, c.grad, 'bleed') + caption(s[0]) + '</figure>';
      }).join('') + '</div>';

    else if (b.result) {
      var inner;
      if (Array.isArray(b.result)) inner = '<div class="rrow">' + b.result.map(function (r) { return '<span>' + r + '</span>'; }).join('') + '</div>';
      else if (typeof b.result === 'object') inner = '<p class="stat">' + b.result.stat + '</p><p>' + b.result.p + '</p>';
      else inner = '<p>' + b.result + '</p>';
      bh += '<div class="result-card rv"><span class="rk">Result</span>' + inner + '</div>';

  return bh;
}

h += textSection(c.challenge, 'The challenge');
if (c.problem) h += textSection(c.problem, 'The challenge');

/* approach — header aligns with the card row when one is present */
h += '<section' + (c.approachNav ? ' data-nav="' + c.approachNav + '"' : '') + '>' +

  h += '<div class="wrap"><div class="ap-outro">' + [].concat(c.approachOutro).map(function (p) {
    return '<p class="rv">' + p + '</p>';

/* the stat a problem closes on renders in the sticky rail beside its
   heading, not at the bottom of the column that scrolled past it */
function resultRailHtml(result) {
  var inner;
  /* An array of {stat, p} is several measured outcomes rather than one: each
     keeps the big serif figure, stacked down the rail. Distinct from an array
     of STRINGS, which is the unquantified list Performance Tracking uses. */
  if (Array.isArray(result) && result.length && typeof result[0] === 'object') {
    inner = '<div class="prob-result-multi">' + result.map(function (r) {
      return '<div><p class="prob-stat">' + r.stat + '</p>' +
        '<p class="prob-result-p">' + r.p + '</p></div>';
    }).join('') + '</div>';
  } else if (Array.isArray(result)) {
    inner = '<ul class="prob-result-list">' + result.map(function (r) { return '<li>' + r + '</li>'; }).join('') + '</ul>';
  } else if (typeof result === 'object') {
    inner = '<p class="prob-stat">' + result.stat + '</p><p class="prob-result-p">' + result.p + '</p>';
  } else {
    inner = '<p class="prob-result-p">' + result + '</p>';
  }
  return '<div class="rv"><p class="prob-result-k">Result</p>' + inner + '</div>';
}

/* problem walkthroughs — the approach, one problem at a time. A sticky left
   rail carries the number, heading and result; the narrative scrolls past
   it on the right. */
(c.problems || []).forEach(function (pr, i) {
  var blocks = pr.blocks.slice();
  var last = blocks[blocks.length - 1];
  var result = (last && last.result) ? blocks.pop().result : null;
  h += '<div class="wrap prob' + (i > 0 ? ' prob--sep' : '') + '">' +
    '<div class="prob-rail">' +
      '<p class="prob-k rv">Problem 0' + (i + 1) + '</p>' +
      '<h3 class="prob-h rv">' + pr.h + '</h3>' +
      (result ? resultRailHtml(result) : '') +
    '</div>' +
    '<div class="prob-body">' + blocksHtml(blocks) + '</div>' +
  '</div>';
});
(c.approach || []).forEach(function (a) {
  h += '<div class="step"><div class="narrow"><h3 class="rv">' + a.h + '</h3>' +
    (a.p ? '<p class="rv">' + a.p + '</p>' : '') + '</div>';
  if (a.callouts) {
    h += '<div class="narrow"><div class="callouts rv">' + a.callouts.map(function (co) {
      return '<div class="callout"><b>' + co[0] + '</b><span>' + co[1] + '</span></div>';
    }).join('') + '</div></div>';
  }
  if (a.shot) {
    h += '<div class="wrap"><figure class="figure rv">' + shot(a.shot, c.grad) +
      '<figcaption>' + a.shot[0] + '</figcaption></figure></div>';
  }
  h += '</div>';
});
h += '</section>';

/* solutions — one section per problem, any layout (split / wide / stacked) */
(c.solutions || []).forEach(function (s) { h += textSection(s, 'The solution'); });

/* breakthrough */
if (c.breakthrough) {
  h += '<section><div class="narrow">' +
    kickHtml('The breakthrough') +
    '<h2 class="rv">' + c.breakthrough.h + '</h2>' +
    '<p class="rv">' + c.breakthrough.p + '</p>' +
    '</div><div class="wrap"><figure class="figure rv">' + shot(c.breakthrough.shot, c.grad, 'bleed') +
    '<figcaption>' + c.breakthrough.shot[0] + '</figcaption></figure></div></section>';
}

/* quote */
if (c.quote) {
  h += '<div class="quote"><div class="narrow rv"><blockquote>&ldquo;' + c.quote[0] + '&rdquo;</blockquote>' +
    '<cite>' + c.quote[1] + '</cite></div></div>';
}

/* results: flow + outcomes */
if (c.flow || c.outcomes) {
  h += '<section><div class="narrow">' + kickHtml('The results') +
    '<h2 class="rv">What shipped, and what it moved</h2></div>' +
    '<div class="wrap">' +
    (c.flow ? '<div class="flow rv">' + c.flow.map(function (f, i) {
      return '<div>' + shot([f[0], ''], c.grad) + '<p>' + (i + 1) + '. ' + f[0] + '<span>' + f[1] + '</span></p></div>';
    }).join('') + '</div>' : '') +
    (c.outcomes ? '<div class="outcomes rv">' + c.outcomes.map(function (o) {
      return '<div class="outcome"><p class="stat">' + o.stat + '</p><h3>' + o.h + '</h3><p>' + o.p + '</p></div>';
    }).join('') + '</div>' : '') +
    '</div></section>';
}

/* footer — just the way back, no next-project card */
h += '<footer class="cs-foot"><div class="wrap">' +
  '<a class="home" href="index.html#s-work">← Back to all work</a>' +
  '</div></footer>';

document.getElementById('cs').innerHTML = h;

/* section nav — built from the rendered kickers, absent through the hero */
var navSecs = [].slice.call(document.querySelectorAll('#cs section')).filter(function (s) { return s.querySelector('.kicker'); });
if (navSecs.length > 1) {
  var secnav = document.createElement('nav');
  secnav.className = 'secnav';
  secnav.setAttribute('aria-label', 'Case study sections');
  secnav.innerHTML = '<div class="wrap">' + navSecs.map(function (s, i) {
    s.id = 'sec' + (i + 1);
    var label = s.querySelector('.kicker').textContent.replace(/^\d+\s*/, '');
    var sub = s.getAttribute('data-nav') || (s.querySelector('h2') ? s.querySelector('h2').textContent : '');
    return '<a href="#sec' + (i + 1) + '"><b>' + label + '</b><span>' + sub + '</span></a>';
  }).join('') + '</div>';
  /* Before the first real section (Context), not #cs's actual first child
     (the hero) — sticky only pins once its in-flow position reaches the
     top, so placed here it stays out of the way through the hero and only
     locks in as the reader is about to arrive at Context. */
  document.getElementById('cs').insertBefore(secnav, navSecs[0]);
  var navLinks = [].slice.call(secnav.querySelectorAll('a'));
  var navTick = function () {
    var edge = secnav.getBoundingClientRect().bottom + 80;
    var cur = 0;
    navSecs.forEach(function (s, i) { if (s.getBoundingClientRect().top <= edge) cur = i; });
    navLinks.forEach(function (a, i) {
      a.classList.toggle('on', i === cur);
      if (i === cur) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current');
    });
  };
  addEventListener('scroll', navTick, { passive: true });
  navTick();
}

/* reveals (rect-based, same pattern as the rest of the site), plus a soft
   parallax on the hero banner */
var rv = [].slice.call(document.querySelectorAll('.rv'));
var heroShot = document.querySelector('.hero-banner .shot');

/* A clip that loops forever with no way to stop it is exactly what "reduce
   motion" is asking us not to do. There it holds on its poster frame and gets
   its controls back, so the content is still reachable — everywhere else it
   plays silently with no chrome, as designed. */
var QUIET = matchMedia('(prefers-reduced-motion: reduce)').matches;
var protos = [].slice.call(document.querySelectorAll('.proto video, .splash-media video'));
if (QUIET) protos.forEach(function (v) {
  v.removeAttribute('autoplay'); v.removeAttribute('loop');
  v.controls = true; v.pause();
});
function tick() {
  var vh = innerHeight, batch = 0;
  for (var i = 0; i < rv.length; i++) {
    var b = rv[i].getBoundingClientRect();
    if (b.top < vh * 0.9 && b.bottom > 0) {
      /* stagger elements that reveal together */
      rv[i].style.transitionDelay = Math.min(batch * 70, 420) + 'ms'; batch++;
      rv[i].classList.add('in');
      rv.splice(i, 1); i--;
    }
  }
  if (heroShot && heroShot.tagName !== 'IMG') {
    var hr = heroShot.parentElement.getBoundingClientRect();
    if (hr.bottom > 0 && hr.top < vh) heroShot.style.transform = 'scale(1.08) translateY(' + (-hr.top * 0.08).toFixed(1) + 'px)';
  }
  /* a looping clip decoding off-screen is pure battery burn — only run the
     ones actually on screen. Left alone entirely when motion is reduced. */
  if (!QUIET) protos.forEach(function (v) {
    var r = v.getBoundingClientRect();
    if (r.bottom > 0 && r.top < vh) { if (v.paused) v.play().catch(function () {}); }
    else if (!v.paused) v.pause();
  });
}
addEventListener('scroll', tick, { passive: true });
tick();
setInterval(tick, 600);

if (EMBED) {
  /* "back to all work" dismisses the parent layer; next-case stays in it */
  var home = document.querySelector('.cs-foot .home');
  if (home) home.addEventListener('click', bubbleClose);
  var nx = document.querySelector('.next');
  if (nx) nx.setAttribute('href', nx.getAttribute('href') + '&embed=1');
}

}

/* the × and Escape dismiss the parent layer — must work even while the gate is up */
function bubbleClose(e) { e.preventDefault(); parent.postMessage('case:close', '*'); }
if (EMBED) {
  document.querySelector('.cs-close').addEventListener('click', bubbleClose);
  addEventListener('keydown', function (e) { if (e.key === 'Escape') parent.postMessage('case:close', '*'); });
}
</script>
</body>
</html>
