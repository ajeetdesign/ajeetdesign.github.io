<!doctype html><meta charset=utf-8>
<style>html,body{margin:0;background:#111;overflow:hidden}iframe{border:0;display:block;width:1440px;height:900px}</style>
<iframe id="f" src="index.html"></iframe>
<div id="p" style="position:fixed;left:1450px;top:0;color:#0f0;background:#000;font:12px monospace;padding:6px;width:340px;white-space:pre-wrap"></div>
<script>
var f=document.getElementById('f'), errs=[];
f.onload=function(){
  f.contentWindow.addEventListener('error',function(e){errs.push(e.message);});
  setTimeout(function(){var d=f.contentWindow.document;
   [].forEach.call(d.querySelectorAll('.reveal'),function(e){e.classList.add('in');});
   document.getElementById('p').textContent='errors: '+(errs.length?errs.join('|'):'none');
  },5000);};
</script>
